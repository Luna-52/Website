<!DOCTYPE html>
<html lang="en">
<head>
<title> Contact Us </title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- These are all the links to CSS files for the webpage-->
<!-- Removing any of the links will almost certainly break the webpage -->
<link rel="stylesheet" href="Navbar.css">
<link rel="stylesheet" href="Layout1.css">
<link rel="stylesheet" href="Form.css">
</head>
<body>
<!-- The navbar class creates a list of links -->
<!-- Any new additional links for the navbar in the future should be included in this list -->
<div class="navbar">
<ul>
    <li><a href="Index.HTML">Home</a></li>
    <li><a href="Adventures.HTML">Adventures</a></li>
    <li><a href="Contact.HTML">Contact Us</a></li>
</ul>
</div>

<div class="header">
    <h1>Contact Us Here Via Email</h1>
</div>

<div class="custom-line"></div>

<!-- This is the form for the contact page -->
<!-- Action is a link attached to the submit button -->
<!-- Inpit creates a message box that allows the user to input a relevant message -->
<div class="form1">
    <form action="Submit.HTML"> 
      <input type="text" id="email" name="emailaddress" placeholder="Enter your email">
      <input type="text" id="subject" name="subject" placeholder="Subject">
      <textarea id="message" name="messagebox" placeholder="Enter message"></textarea>
      <input type="submit" value="Submit">
    </form>
</div>


<footer class="footer"><p>©Adventure Holidays 2025</p></footer>


</body>
</html>
